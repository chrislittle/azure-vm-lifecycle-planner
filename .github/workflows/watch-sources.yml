# Each Monday: reads the Microsoft Learn pages that the tool's data and words come
# from (tools/sources.mjs) and compares them with tools/source-snapshot.json; then
# reads Azure itself (tools/azure-sources.mjs): the size list, the NVA policy and the
# Marketplace catalog, and compares them with the data files.
# For a page that changed, or that it cannot read, it opens one GitHub issue (label
# source-watch), or comments on the open one. When the page and the snapshot agree
# again, it closes that issue. It never changes the data: a person updates the data in
# a pull request, so the tests run.
# GitHub turns off a scheduled workflow in a public repo after 60 days with no activity
# in the repo, and sends only an email. So each run also turns this workflow on again
# (job keep-on: one REST API call, no commit). If GitHub turns it off all the same,
# turn it on again in the Actions tab.
# Each action is pinned to the exact commit of a release; the comment gives the version.
name: Watch the sources

on:
  schedule:
    - cron: '17 6 * * 1'   # Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watch-sources
  cancel-in-progress: false

jobs:
  # "In a public repository, scheduled workflows are automatically disabled when no
  # repository activity has occurred in 60 days." (docs.github.com, Disabling and
  # enabling a workflow). This job calls "Enable a workflow"
  # (PUT /repos/{owner}/{repo}/actions/workflows/{workflow_id}/enable) for this
  # workflow each week, with no commit. GitHub does not say what counts as activity;
  # other public repos report that this call keeps a workflow on after 60 days. If it
  # does not, GitHub sends its email as before. It is a separate job so that it has
  # only actions: write, and no Azure environment or secret; the watch job keeps its
  # own permissions. It does not need the code, so there is no checkout. It runs only
  # on the default branch, and does not wait for the watch job (an Azure failure does
  # not stop it).
  keep-on:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      # The API call, not "gh workflow enable": that command looks only for workflows
      # that are off. The API call also accepts a workflow that is on (204).
      - name: Keep this workflow turned on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GITHUB_WORKFLOW_REF: owner/repo/.github/workflows/<file>@<ref>
          file="${GITHUB_WORKFLOW_REF%%@*}"
          file="${file##*/}"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${file}/enable"
          echo "Turned on: ${file}"

  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # The read-only Azure sign-in exists only in this environment, and the environment
    # allows only the main branch. A fork or a pull request cannot sign in.
    environment: azure-read
    permissions:
      contents: read
      issues: write
      id-token: write   # for the Azure sign-in without a stored password (OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      # No token here: this step reads public pages only.
      - name: Read the pages
        run: node tools/watch-sources.mjs
      # Sign in to Azure as the read-only identity (role "VM Lifecycle Planner source
      # reader": VM sizes, Marketplace publishers and offers, policy definitions,
      # regions; no resources). If the sign-in fails, the next step reports each Azure
      # source as "cannot read", so the problem gets an issue.
      - name: Sign in to Azure (read only)
        id: azure
        continue-on-error: true
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # The role cannot list subscriptions (it does not need to): do not ask for it.
          allow-no-subscriptions: true
      - name: Read Azure
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: node tools/azure-sources.mjs
      # Always, also when a step before failed: the reports that exist still get issues.
      - name: Open, comment on or close the issues
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          errors=0
          gh label create source-watch --color 0b6bcb --description "A Microsoft source changed" 2>/dev/null || true
          # The open issues, read once. If GitHub cannot list them, stop: never open a
          # second issue for a page because the list failed.
          if ! issues="$(gh issue list --state open --label source-watch --limit 200 --json number,title)"; then
            echo "::error::Cannot list the open issues. Nothing was changed."
            exit 1
          fi
          # The open issue for a title (titles come from tools/sources.mjs, not from a page).
          open_issue() { jq -r --arg t "$1" '.[] | select(.title == $t) | .number' <<< "$issues" | head -n 1; }
          for f in watch-report/*.md; do
            title="$(head -n 1 "$f" | sed 's/^# //')"
            tail -n +2 "$f" > body.md
            number="$(open_issue "$title")"
            if [ -n "$number" ]; then
              print="$(grep -o 'source-check-fingerprint: [a-z0-9-]*' body.md || true)"
              # Only a new difference gets a comment: the same one is already on the issue.
              if ! text="$(gh issue view "$number" --json body,comments --jq '.body, .comments[].body')"; then
                echo "::error::Cannot read #$number: $title"; errors=$((errors+1)); continue
              fi
              if [ -n "$print" ] && grep -qF "$print" <<< "$text"; then
                echo "No new difference for #$number: $title"
              else
                gh issue comment "$number" --body-file body.md && echo "Commented on #$number: $title"                   || { echo "::error::Cannot comment on #$number"; errors=$((errors+1)); }
              fi
            else
              gh issue create --title "$title" --body-file body.md --label source-watch && echo "Opened: $title"                 || { echo "::error::Cannot open an issue: $title"; errors=$((errors+1)); }
            fi
          done
          for f in watch-report/*.ok; do
            title="$(head -n 1 "$f")"
            number="$(open_issue "$title")"
            if [ -n "$number" ]; then
              gh issue close "$number" --comment "The weekly check found that this source and the data of this repo agree again. Closing."                 && echo "Closed #$number: $title" || { echo "::error::Cannot close #$number"; errors=$((errors+1)); }
            fi
          done
          exit "$errors"
